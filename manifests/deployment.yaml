apiVersion: apps/v1
kind: Deployment
metadata:
  name: fournos
  labels:
    app: fournos
spec:
  replicas: 1
  # The operator reconciles a given job without a distributed leader lock.
  # Do not overlap old and new pods during a rollout: two reconcilers could
  # otherwise race PipelineRun creation against Kueue eviction.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fournos
  template:
    metadata:
      labels:
        app: fournos
    spec:
      serviceAccountName: fournos
      containers:
        - name: fournos
          image: quay.io/rh_perfscale/fournos:latest
          env:
            - name: FOURNOS_WORKLOAD_NAMESPACE
              value: "${NAMESPACE}"
          ports:
            - containerPort: 8080
              name: health
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 10
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 512Mi
