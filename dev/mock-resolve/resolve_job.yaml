# Minimal Job template for local dev / CI with the mock-resolve image.
#
# Follows the same /opt/fournos/entrypoint contract as the production
# template (config/resolve/resolve_job.yaml) so CI validates the same
# entrypoint path that production uses.
apiVersion: batch/v1
kind: Job
spec:
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: fournos
      restartPolicy: Never
      containers:
        - name: resolve
          imagePullPolicy: IfNotPresent
          command: ["/opt/fournos/entrypoint"]
          args: []
          env:
            - name: FJOB_NAME
            - name: FOURNOS_WORKLOAD_NAMESPACE
            - name: FOURNOS_STEP
              value: resolve-fournos-config
            - name: FOURNOS_CI
              value: "true"
