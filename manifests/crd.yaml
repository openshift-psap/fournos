apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: fournosjobs.fournos.dev
spec:
  group: fournos.dev
  names:
    kind: FournosJob
    listKind: FournosJobList
    plural: fournosjobs
    singular: fournosjob
    shortNames:
      - fj
      - fjob
      - fjobs
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Owner
          type: string
          jsonPath: .spec.owner
        - name: Display Name
          type: string
          jsonPath: .spec.displayName
          priority: 1
        - name: Exclusive
          type: boolean
          jsonPath: .spec.exclusive
          priority: 1
        - name: Scheduled For
          type: string
          jsonPath: .spec.scheduledStartTime
          priority: 1
        - name: Schedule
          type: string
          jsonPath: .spec.schedule
          priority: 1
        - name: Locked Until
          type: string
          jsonPath: .spec.lockUntil
          priority: 1
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Cluster
          type: string
          jsonPath: .status.cluster
        - name: Message
          type: string
          jsonPath: .status.message
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: []
              properties:
                owner:
                  type: string
                  description: Team or individual that owns this job.
                displayName:
                  type: string
                  description: >-
                    Human-readable job name for external correlation.
                    Falls back to metadata.name if not set. Does not need to be unique.
                pipeline:
                  type: string
                  default: "fournos-full"
                cluster:
                  type: string
                  description: >-
                    Pin this job to one target cluster. Mutually exclusive with
                    gpuPool.
                gpuPool:
                  type: string
                  maxLength: 63
                  pattern: "^[a-z0-9]([a-z0-9.-]*[a-z0-9])?$"
                  description: >-
                    Named pool of clusters that can run this GPU type. Pool
                    membership is configured on each Kueue ResourceFlavor.
                    Kueue admits the whole GPU request on one cluster; it does
                    not combine quota across clusters. Mutually exclusive with
                    cluster.
                hardware:
                  type: object
                  required:
                    - gpuType
                    - gpuCount
                  properties:
                    gpuType:
                      type: string
                      pattern: "^[a-z0-9]+$"
                      description: >-
                        Short GPU model name (e.g. "a100", "h200").
                        The operator prepends the resource prefix automatically.
                        Must be lowercase alphanumeric — no slashes or vendor prefixes.
                    gpuCount:
                      type: integer
                      minimum: 1
                executionEngine:
                  type: object
                  description: >-
                    Execution engine configuration. The top-level key is the
                    engine name (e.g. "forge") and its value is the
                    engine-specific config.
                  x-kubernetes-preserve-unknown-fields: true
                secretRefs:
                  type: array
                  description: >-
                    Vault entry names (without the vault- prefix) to mount
                    into the pipeline.  The operator prepends vault- to
                    look up the corresponding K8s Secret (which must carry
                    the fournos.dev/vault-entry=true label) in the secrets
                    namespace. Populated by the execution engine during the
                    Resolving phase when not provided by the user.
                  items:
                    type: string
                    pattern: "^[a-z0-9]([a-z0-9\\-]{0,61}[a-z0-9])?$"
                env:
                  type: object
                  description: Environment variables used to identify the test run.
                  additionalProperties:
                    type: string
                exclusive:
                  type: boolean
                  default: true
                  description: >-
                    Lock the target cluster for exclusive use by this job.
                    When true, the job waits until the cluster has no other active
                    jobs and then prevents any new job from being scheduled there.
                    Requires 'cluster' or 'gpuPool' to be set. Hardware is
                    optional only when pinned to a specific cluster; a GPU pool
                    requires hardware so Kueue can select a compatible cluster.
                clusterless:
                  type: boolean
                  default: false
                  description: >-
                    Run without cluster access - no kubeconfig is passed to the
                    execution environment. Cannot be combined with 'cluster',
                    'gpuPool', or 'exclusive: true'. Hardware specifications are optional -
                    if omitted, the job runs on hub cluster resources without
                    Kueue hardware scheduling.
                lockOnly:
                  type: boolean
                  description: >-
                    Sentinel lock job that holds cluster quota without running
                    a pipeline. Created by the hearth controller to
                    implement human-driven cluster ownership. Implies
                    exclusive: true and requires 'cluster'. Skips execution
                    engine resolution and PipelineRun creation — the job
                    stays Admitted until deleted, or until lockUntil is
                    reached if set. If omitted, defaults to true when
                    lockUntil is set and false otherwise — so a bare
                    lockUntil is enough to create a timed lock job. Set
                    explicitly to false to reject a stray lockUntil.
                lockUntil:
                  type: string
                  format: date-time
                  description: >-
                    If set, the lock is released automatically once this UTC
                    timestamp is reached. ISO 8601 format (e.g.
                    "2026-08-23T18:00:00Z"). Setting this alone (without
                    lockOnly) implies lockOnly: true. When omitted the lock
                    is held indefinitely until the job is deleted or shut
                    down.
                priority:
                  type: string
                scheduledStartTime:
                  type: string
                  format: date-time
                  description: >-
                    If set, the job stays in Scheduled phase until this
                    UTC timestamp is reached, then proceeds to Resolving.
                    ISO 8601 format (e.g. "2026-08-18T15:00:00Z").
                    When omitted the job starts immediately.
                    Mutually exclusive with 'schedule'.
                schedule:
                  type: string
                  description: >-
                    Cron expression for recurring execution (e.g.
                    "0 20 * * *" for every day at 20:00 UTC). When set,
                    this job acts as a template in Recurring phase and
                    the operator creates child FournosJob CRs on each
                    cron tick. Mutually exclusive with 'scheduledStartTime'.
                shutdown:
                  type: string
                  enum:
                    - Stop
                    - Terminate
                  description: >-
                    Shutdown action to apply to the job. "Stop" cancels the
                    PipelineRun gracefully (CancelledRunFinally — runs finally
                    tasks). "Terminate" cancels immediately (Cancelled — skips
                    finally tasks). Both wait for the PipelineRun to finish
                    before releasing Kueue quota.
                ttl:
                  type: string
                  description: >-
                    Duration after job completion (Succeeded/Failed/Stopped)
                    before the FournosJob CR is automatically deleted. Uses
                    Go duration format (e.g. "12h", "30m", "7d"). When not
                    set, the job is never auto-pruned.
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Scheduled
                    - Recurring
                    - Resolving
                    - Pending
                    - Admitted
                    - Running
                    - Succeeded
                    - Failed
                    - Stopping
                    - Stopped
                cluster:
                  type: string
                pipelineRun:
                  type: string
                dashboardURL:
                  type: string
                message:
                  type: string
                completionTime:
                  type: string
                  format: date-time
                  description: >-
                    Timestamp when the job entered a terminal phase
                    (Succeeded/Failed/Stopped). Used by the TTL GC to
                    determine when to delete the CR.
                lastScheduledTime:
                  type: string
                  format: date-time
                  description: >-
                    For recurring jobs, the timestamp when the last child
                    job was created. Used to determine the next cron tick.
                engineStatus:
                  type: object
                  description: >-
                    Opaque status blob written by the benchmark execution engine.
                    Fournos preserves it as-is for callers (e.g. OCPCI) to
                    read back information such as artifact URLs.
                  x-kubernetes-preserve-unknown-fields: true
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
